spring:
  application:
    name: task
  datasource:
    url: jdbc:postgresql://localhost:5432/practice
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  app:
    jwtSecret: ${JWT_SECRET}
    jwtExpirationMs: ${JWT_EXP_TIME}